[project]
name = "garmin-mcp"
version = "0.1.0"
description = "Personal MCP server for Garmin Connect: read training/health data, fix strength sets, build workouts."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "garminconnect>=0.3.20,<0.4",
    "pydantic>=2",
    "mcp>=2.3,<3",
]

[project.scripts]
garmin-mcp = "garmin_mcp.server:main"
garmin-mcp-login = "garmin_mcp.auth:login_cli"

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/garmin_mcp"]

[tool.pytest.ini_options]
pythonpath = ["src"]
